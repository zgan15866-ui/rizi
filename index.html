<html lang="zh-CN">

<title>重要日子</title>
<style>
  :root{ --bg:#fbf5f2; --card:#fff; --ink:#2a2224; --muted:#958a8c; --line:#efe4e0;
    --accent:#e03a3e; --soft:#fde9e6; --g1:#ff8a65; --g2:#f05478; --warn:#e0912b; --ok:#2e9c6a; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#171314; --card:#231d1f; --ink:#f5eeef; --muted:#a59a9c; --line:#382f31; --soft:#33242a; --accent:#ff6b6e; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;font-size:16px}
  body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
  main{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:8px 4px 14px}
  h2{font-size:17px;margin:0 0 10px}
  .sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 10px}
  .hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:20px;padding:18px;margin:4px 0 14px}
  .hero .t{font-size:22px;font-weight:800}
  .hero .s{opacity:.92;margin-top:6px;font-size:15px}
  .card{background:var(--card);border-radius:16px;padding:6px 16px;margin-bottom:14px}
  .card.pad{padding:16px}
  .card.bk{border:1.5px dashed var(--accent);padding:16px}
  .sec{font-size:14px;color:var(--muted);margin:16px 4px 8px;font-weight:600}
  .it{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .it:last-child{border-bottom:0}
  .it .em{font-size:26px;width:34px;text-align:center;flex:none}
  .it .mid{flex:1;min-width:0}
  .it .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .dt{font-size:13px;color:var(--muted);margin-top:2px}
  .it .rt{text-align:right;flex:none}
  .it .rt b{font-size:24px;font-variant-numeric:tabular-nums}
  .it .rt small{display:block;font-size:12px;color:var(--muted)}
  .it.hot .rt b{color:var(--accent)}
  .it.today .rt b{color:var(--accent);font-size:18px}
  .it.over .rt b{color:var(--accent)}
  .it.past .nm,.it.past .rt b{color:var(--muted)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font-size:14px}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .chips.scroll button{flex:none}
  button{font-family:inherit}
  .btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600}
  .ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:15px}
  .full{width:100%}
  .row{display:flex;gap:10px;align-items:center}
  select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;width:100%}
  label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  .fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 6px 16px rgba(224,58,62,.35);z-index:6}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
  .tabs button{flex:1;border:0;background:none;padding:9px 0 8px;color:var(--muted);font-size:12px}
  .tabs button b{display:block;font-size:21px;font-weight:400;margin-bottom:1px}
  .tabs button.on{color:var(--accent)}
  .view{display:none}.view.on{display:block}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:rgba(30,20,22,.9);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:50;display:none;max-width:90%}
  .big{text-align:center;padding:10px 0 4px}
  .big .e{font-size:44px}
  .big .n{font-size:22px;font-weight:700;margin-top:4px}
  .big .d{font-size:56px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;margin-top:6px}
  .big .d small{font-size:18px;font-weight:600;color:var(--muted);margin-left:4px}
  .kv{background:var(--bg);border-radius:12px;padding:6px 14px;margin-top:12px}
  .kv div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;gap:12px}
  .kv div:last-child{border-bottom:0}
  .kv span{color:var(--muted);flex:none}
  .kv b{font-weight:500;text-align:right}
  .seg{display:flex;background:var(--bg);border-radius:12px;padding:4px}
  .seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-size:15px;color:var(--muted);font-weight:600}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .three{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px}
  .chk input{width:20px;height:20px}
  .welcome{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  .welcome.on{display:flex}
  .empty{text-align:center;padding:30px 10px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<main>
  <section class="view on" id="v-home">
    <div class="hero"><div class="t" id="heroT">重要日子</div><div class="s" id="heroS"></div></div>
    <div class="card bk" id="bkCard" hidden>
      <div id="bkText"></div>
      <div class="row" style="margin-top:10px"><button class="ghost" id="bkGo" style="flex:1">去备份</button><button class="ghost" id="bkLater" style="flex:1">过几天再说</button></div>
    </div>
    <div class="chips scroll" id="filter"></div>
    <div id="lists"></div>
  </section>
  <section class="view" id="v-set">
    <h1>设置与备份</h1>
    <div class="card pad">
      <label class="f" style="margin-top:0">称呼（首页显示「XX的重要日子」）</label>
      <input id="setName">
      <div class="chk"><input type="checkbox" id="setFest"><label for="setFest">显示传统节日（春节、元宵、端午、七夕、中秋、重阳、腊八、除夕）</label></div>
    </div>
    <div class="card pad">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">分类</h2><button class="ghost" id="addCat" style="padding:7px 12px">＋ 新分类</button></div>
      <p class="sub" style="margin-top:8px">点分类可以改名字、图标和默认设置。</p>
      <div id="catList"></div>
    </div>
    <div class="card pad">
      <h2>备份</h2>
      <p class="sub">数据只保存在这台手机上。建议每月导出一次备份，存到「文件」或发给自己。换手机时用「从备份恢复」。</p>
      <div class="row"><button class="ghost" id="exportJson" style="flex:1">导出备份</button><button class="ghost" id="importBtn" style="flex:1">从备份恢复</button></div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <p class="sub" id="countInfo" style="margin-top:10px"></p>
    </div>
    <p class="sub" style="text-align:center">网页 App 不能在锁屏弹通知，提醒在打开 App 时显示。<br>特别重要的日子，可以再在 iPhone「提醒事项」里设一条。</p>
  </section>
</main>
<button class="fab" id="fab">＋</button>
<nav class="tabs" id="tabs">
  <button data-v="home" class="on"><b>📅</b>日子</button>
  <button data-v="set"><b>⚙️</b>设置</button>
</nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="welcome" id="welcome">
  <div class="card pad" style="width:100%;max-width:420px">
    <h2>👋 欢迎使用重要日子</h2>
    <p class="sub">先告诉我怎么称呼你。生日、纪念日、证件到期、倒数日都可以记在这里，农历生日会自动换算成每年的公历日期。</p>
    <input id="wName" placeholder="比如：老赵">
    <button class="btn full" id="wGo" style="margin-top:14px">开始</button>
  </div>
</div>

function festivals(){
  if(!db.fest) return [];
  return FEST.map(function(f,i){ return {id:"f"+i,name:f[0],cat:"__fest",cal:"l",m:f[1],d:f[2],rep:"y",remind:7,fest:1}; });
}
function describe(it){
  var c=it.fest?{em:"🏮",name:"节日"}:cat(it.cat), o=occurrence(it), s="";
  if(o.date==null) return {o:o,c:c,big:"—",unit:"",line:"日期超出范围"};
  var big,unit;
  if(o.days===0){ big="今天"; unit=""; }
  else if(o.days>0){ big=o.days; unit="天后"; }
  else { big=-o.days; unit = c.expire ? "天前过期" : "天前"; }
  // 日期说明
  var dateTxt=fmtSolar(o.date, ymd(o.date).y!==ymd(today()).y)+" "+fmtW(o.date);
  if(it.cal==="l") dateTxt += " · 农历"+(it.d===0?"腊月最后一天":lmName(it.m,it.leap)+ldName(it.d));
  var extra="";
  if(o.count>0) extra = c.age ? "满 "+o.count+" 岁" : "第 "+o.count+" 周年";
  return {o:o,c:c,big:big,unit:unit,date:dateTxt,extra:extra};
}

// ---------- 首页 ----------
var filt="all";
function renderHome(){
  var t=today(), l=solarToLunar(t);
  $("heroT").textContent=(db.name||"我")+"的重要日子";
  $("heroS").textContent=fmtSolar(t,true)+" "+fmtW(t)+" · 农历"+fmtLunar(l,false);
  var cats=[["all","全部"]].concat(db.cats.map(function(c){ return [c.id,c.em+" "+c.name]; }));
  if(db.fest) cats.push(["__fest","🏮 节日"]);
  $("filter").innerHTML=cats.map(function(c){ return '<button data-c="'+c[0]+'" class="'+(c[0]===filt?"on":"")+'">'+esc(c[1])+'</button>'; }).join("");
  var all=db.items.concat(festivals()).filter(function(it){ return filt==="all" || (filt==="__fest"?it.fest:it.cat===filt); });
  var rows=all.map(function(it){ return {it:it,d:describe(it)}; });
  var soon=[],later=[],past=[];
  rows.forEach(function(r){
    var o=r.d.o, rem=r.it.remind||0;
    if(o.date==null){ later.push(r); return; }
    if(o.days<0){ (r.d.c.expire && o.days>=-90 ? soon : past).push(r); return; }
    if(o.days<=rem || o.days===0) soon.push(r); else later.push(r);
  });
  var by=function(a,b){ return (a.d.o.days==null?1e9:a.d.o.days)-(b.d.o.days==null?1e9:b.d.o.days); };
  soon.sort(by); later.sort(by); past.sort(function(a,b){ return b.d.o.days-a.d.o.days; });
  var h="";
  if(!rows.length) h='<div class="card"><div class="empty">还没有记录。<br>点右下角的 ＋ 添加第一个重要日子吧。</div></div>';
  if(soon.length) h+='<div class="sec">🔔 快到了</div><div class="card">'+soon.map(rowHtml).join("")+'</div>';
  if(later.length) h+='<div class="sec">'+(soon.length?"以后":"接下来")+'</div><div class="card">'+later.map(rowHtml).join("")+'</div>';
  if(past.length) h+='<div class="sec">已经过去</div><div class="card">'+past.map(rowHtml).join("")+'</div>';
  $("lists").innerHTML=h;
  checkBackup();
}
function rowHtml(r){
  var it=r.it, d=r.d, o=d.o, cls="it";
  if(o.days===0) cls+=" today"; else if(o.days<0) cls+= d.c.expire?" over":" past"; else if(o.days<=(it.remind||0)) cls+=" hot";
  return '<div class="'+cls+'" data-id="'+it.id+'"><div class="em">'+esc(d.c.em)+'</div><div class="mid"><div class="nm">'+esc(it.name)+(d.extra?' <span class="sub" style="font-weight:400">· '+d.extra+'</span>':'')+'</div><div class="dt">'+esc(d.date||"")+'</div></div>'+
    '<div class="rt"><b>'+d.big+'</b><small>'+d.unit+'</small></div></div>';
}

function findItem(id){ if(id[0]==="f") return festivals().filter(function(f){return f.id===id;})[0]; return db.items.filter(function(x){return x.id===id;})[0]; }
function openItem(id){
  var it=findItem(id); if(!it) return;
  var d=describe(it), o=d.o, kv="";
  if(o.date!=null){
    kv+='<div><span>'+(it.rep==="n"?"日期":"下一次")+'</span><b>'+fmtSolar(o.date,true)+' '+fmtW(o.date)+'</b></div>';
    kv+='<div><span>农历</span><b>'+fmtLunar(solarToLunar(o.date),true)+'</b></div>';
  }
  if(it.cal==="l" && it.rep!=="n") kv+='<div><span>按农历</span><b>每年'+(it.d===0?"腊月最后一天（除夕）":lmName(it.m,it.leap)+ldName(it.d))+'</b></div>';
  var od=originDay(it);
  if(od!=null && it.rep!=="n"){
    kv+='<div><span>'+(d.c.age?"出生":"开始")+'</span><b>'+fmtSolar(od,true)+(it.cal==="l"?"（农历"+fmtLunar({y:it.y,m:it.m,d:it.d,leap:it.leap},false)+"）":"")+'</b></div>';
    var since=today()-od; if(since>=0) kv+='<div><span>已经</span><b>'+since.toLocaleString()+' 天</b></div>';
  }
  if(d.extra) kv+='<div><span>'+(d.c.age?"年龄":"周年")+'</span><b>'+(o.days===0?"今天":"这次")+d.extra+'</b></div>';
  if(it.rep) kv+='<div><span>重复</span><b>'+({y:"每年",m:"每月",n:"不重复"})[it.rep]+'</b></div>';
  kv+='<div><span>提醒</span><b>'+(it.remind?"提前 "+it.remind+" 天出现在「快到了」":"当天")+'</b></div>';
  if(it.note) kv+='<div><span>备注</span><b style="white-space:pre-wrap">'+esc(it.note)+'</b></div>';
  var bigTxt = o.days===0 ? '<div class="d">就是今天</div>' : '<div class="d">'+d.big+'<small>'+d.unit+'</small></div>';
  sheet('<div class="big"><div class="e">'+esc(d.c.em)+'</div><div class="n">'+esc(it.name)+'</div>'+bigTxt+'</div><div class="kv">'+kv+'</div>'+
    (it.fest?'<p class="sub" style="margin-top:12px">传统节日可以在「设置」里关掉。</p>':
    (d.c.expire && it.rep==="n" ? '<button class="btn full" data-act="renew" style="margin-top:14px">已续期，改新日期</button>':'')+
    '<div class="row" style="margin-top:12px"><button class="ghost" data-act="edit" style="flex:1">编辑</button><button class="ghost" data-act="del" style="flex:1;color:var(--accent)">删除</button></div>')+
    '<button class="ghost full" data-act="close" style="margin-top:10px">关闭</button>', function(act){
      if(act==="edit"||act==="renew"){ closeSheet(); editItem(it); return; }
      if(act==="del"){ if(delArm!==it.id){ delArm=it.id; toast("再点一次「删除」确认",2000); setTimeout(function(){delArm=null;},2500); return; }
        db.items=db.items.filter(function(x){return x.id!==it.id;}); persist(); closeSheet(); toast("已删除"); renderHome(); }
    });
}

var F=null; // 正在编辑的表单状态
function editItem(it){
  var c0 = filt!=="all" && filt!=="__fest" ? filt : db.cats[0].id;
  var tc=solarToLunar(today());
  F = it ? JSON.parse(JSON.stringify(it)) : {cat:c0, cal:"s", rep:cat(c0).rep, remind:cat(c0).remind, y:0, m:0, d:0, leap:false};

  if(!it){ var a=ymd(today()); F.y=a.y; F.m=a.m; F.d=a.d; }
  F.noYear = !F.isNew && !F.y;
  renderForm();
}
function renderForm(){
  var catChips=db.cats.map(function(c){ return '<button data-cat="'+c.id+'" class="'+(c.id===F.cat?"on":"")+'">'+esc(c.em+" "+c.name)+'</button>'; }).join("");
  var h='<h2>'+(F.isNew?"添加重要日子":"编辑")+'</h2>'+
    '<label class="f" style="margin-top:0">名称 *</label><input id="fN" value="'+esc(F.name||"")+'" placeholder="比如：彦神生日、护照到期、结婚纪念日">'+
    '<label class="f">分类</label><div class="chips" id="fCat">'+catChips+'</div>'+

    '<div id="fDate" style="margin-top:10px"></div>'+
    '<label class="f">重复</label><div class="chips" id="fRep">'+[["y","每年"],["m","每月"],["n","不重复"]].map(function(r){ return '<button data-v="'+r[0]+'" class="'+(F.rep===r[0]?"on":"")+'"'+(F.cal==="l"&&r[0]==="m"?" disabled style=\"opacity:.35\"":"")+'>'+r[1]+'</button>'; }).join("")+'</div>'+
    '<label class="f">提前几天提醒（出现在「快到了」）</label><div class="chips" id="fRem">'+[0,1,3,7,15,30,60,90].map(function(n){ return '<button data-v="'+n+'" class="'+(+F.remind===n?"on":"")+'">'+(n?n+" 天":"当天")+'</button>'; }).join("")+'</div>'+
    '<label class="f">备注（选填）</label><input id="fNote" value="'+esc(F.note||"")+'" placeholder="比如：礼物想法、续期要带的材料">'+
    '<div class="row" style="margin-top:16px"><button class="ghost" data-act="close" style="flex:1">取消</button><button class="btn" data-act="save" style="flex:2">保存</button></div>';
  var keepName = $("fN") ? $("fN").value : null, keepNote = $("fNote") ? $("fNote").value : null;
  sheet(h, onForm);
  if(keepName!=null){ $("fN").value=keepName; $("fNote").value=keepNote; }
  renderDate();
}
function renderDate(){
  var h="", yearly=F.rep!=="n";
  if(F.cal==="s"){
    if(yearly && F.noYear){
      h='<div class="three" style="grid-template-columns:1fr 1fr"><select id="fM">'+range(1,12).map(function(m){ return '<option value="'+m+'"'+(m===F.m?" selected":"")+'>'+m+' 月</option>'; }).join("")+'</select>'+
        '<select id="fD">'+range(1,31).map(function(d){ return '<option value="'+d+'"'+(d===F.d?" selected":"")+'>'+d+' 日</option>'; }).join("")+'</select></div>';
    } else if(F.rep==="m"){
      h='<select id="fD">'+range(1,31).map(function(d){ return '<option value="'+d+'"'+(d===F.d?" selected":"")+'>每月 '+d+' 日</option>'; }).join("")+'</select><p class="sub" style="margin-top:6px">某个月没有这一天时，算在当月最后一天。</p>';
    } else {
      var v=F.y?F.y+"-"+("0"+F.m).slice(-2)+"-"+("0"+F.d).slice(-2):"";
      h='<input type="date" id="fDate1" value="'+v+'">';
    }
  } else {
    var ys='<option value="0"'+(!F.y?" selected":"")+'>'+(yearly?"不记得年份":"选择年份")+'</option>';
    for(var y=2099;y>=1901;y--) ys+='<option value="'+y+'"'+(y===F.y?" selected":"")+'>'+y+'年</option>';
    var lp=F.y?leapOf(F.y):0, mo="";
    for(var m=1;m<=12;m++){ mo+='<option value="'+m+'"'+(m===F.m&&!F.leap?" selected":"")+'>'+lmName(m,false)+'</option>'; if(m===lp||(!F.y&&F.leap&&m===F.m)) mo+='<option value="L'+m+'"'+(m===F.m&&F.leap?" selected":"")+'>'+lmName(m,true)+'</option>'; }
    var dd=range(1,30).map(function(d){ return '<option value="'+d+'"'+(d===F.d?" selected":"")+'>'+ldName(d)+'</option>'; }).join("");
    h='<div class="three"><select id="fLY">'+ys+'</select><select id="fLM">'+mo+'</select><select id="fLD">'+dd+'</select></div>';
    h+='<p class="sub" id="fLHint" style="margin-top:6px"></p>';
  }
  if(F.cal==="s" && yearly && F.rep==="y") h+='<div class="chk"><input type="checkbox" id="fNoY"'+(F.noYear?" checked":"")+'><label for="fNoY">不记得是哪一年（就不显示几岁/几周年）</label></div>';
  $("fDate").innerHTML=h;
  bindDate();
}
function range(a,b){ var r=[]; for(var i=a;i<=b;i++) r.push(i); return r; }
function readDate(){
  if(F.cal==="s"){
    if($("fDate1")){ var v=$("fDate1").value; if(v){ var p=v.split("-"); F.y=+p[0]; F.m=+p[1]; F.d=+p[2]; } else F.y=0; }
    if($("fM")){ F.m=+$("fM").value; F.y=0; }
    if($("fD")) F.d=+$("fD").value;
  } else {
    F.y=+$("fLY").value; var mv=$("fLM").value; F.leap=mv[0]==="L"; F.m=+mv.replace("L",""); F.d=+$("fLD").value;
  }
}
function bindDate(){
  ["fDate1","fM","fD","fLY","fLM","fLD"].forEach(function(id){ var e=$(id); if(e) e.onchange=function(){ readDate(); if(id==="fLY") renderDate(); else hint(); }; });
  var nY=$("fNoY"); if(nY) nY.onchange=function(){ readDate(); F.noYear=this.checked; if(!F.noYear && !F.y){ var a=ymd(today()); F.y=a.y; if(!F.m){F.m=a.m;F.d=a.d;} } renderDate(); };
  hint();
}
function hint(){
  var e=$("fLHint"); if(!e) return;
  if(F.y){ var n=lunarToSolar(F.y,F.m,F.d,F.leap); if(n!=null){ var ok=solarToLunar(n); e.textContent="对应公历 "+fmtSolar(n,true)+(ok.d!==F.d?"（这个月没有"+ldName(F.d)+"，按"+ldName(ok.d)+"算）":""); } else e.textContent=""; }
  else e.textContent = F.rep==="n" ? "不重复的日子需要选年份" : "每年农历这一天提醒，公历日期自动换算";
}
function onForm(act,b){
  if(b && b.dataset.cat){ readDate(); var c=cat(b.dataset.cat); F.cat=c.id; if(F.isNew){ F.rep=(F.cal==="l"&&c.rep==="m")?"y":c.rep; F.remind=c.remind; if(F.rep==="n") F.noYear=false; } renderForm(); return; }
  if(act!=="save") return;
  readDate();
  var name=$("fN").value.trim(); if(!name){ toast("请填名称"); $("fN").focus(); return; }
  if(F.rep==="n" && !F.y){ toast("不重复的日子要选具体日期（含年份）"); return; }
  if(F.cal==="s" && F.rep!=="m" && (!F.m||!F.d)){ toast("请选日期"); return; }
  if(F.cal==="l" && F.y && lunarToSolar(F.y,F.m,F.d,F.leap)==null){ toast("这个农历日期超出范围"); return; }
  if(F.noYear && F.cal==="s") F.y=0;
  var it={name:name,cat:F.cat,cal:F.cal,y:F.y||0,m:F.m,d:F.d,leap:!!F.leap,rep:F.rep,remind:+F.remind,note:$("fNote").value.trim()};
  if(F.rep==="m"){ it.cal="s"; it.y=0; it.m=0; }
  if(F.isNew){ it.id="i"+(db.nextId++); db.items.push(it); }
  else { it.id=F.id; db.items=db.items.map(function(x){ return x.id===F.id?it:x; }); }
  persist(); closeSheet(); toast("已保存"); renderHome();
}
$("sheet").addEventListener("click",function(e){
  if(!F) return;
  var b=e.target.closest("#fCal button, #fRep button, #fRem button"); if(!b) return;
  readDate();
  var p=b.parentNode.id;
  if(p==="fCal"){ var nv=b.dataset.v; if(nv!==F.cal){ // 切换公历/农历时自动换算日期
      if(F.y){ if(nv==="l"){ var l=solarToLunar(dn(F.y,F.m||1,F.d||1)); F.y=l.y; F.m=l.m; F.d=l.d; F.leap=l.leap; } else { var n=lunarToSolar(F.y,F.m,F.d,F.leap); var a=ymd(n); F.y=a.y; F.m=a.m; F.d=a.d; F.leap=false; } }
      else { if(!F.m) F.m=1; if(!F.d) F.d=1; F.leap=false; }
      F.cal=nv; if(nv==="l" && F.rep==="m") F.rep="y"; F.noYear=false; } }
  if(p==="fRep"){ if(b.disabled) return; F.rep=b.dataset.v; if(F.rep==="n") F.noYear=false; if(F.rep==="m" && !F.d) F.d=1; }
  if(p==="fRem") F.remind=+b.dataset.v;
  renderForm();
});

var EMOJI="🎂 💍 📄 💳 ⏳ ❤️ 🎓 🏠 🚗 🐶 ✈️ 🏥 💊 🎁 🌸 ⭐ 📌 🏮 💼 📚".split(" ");
function editCat(id){
  var c = id ? JSON.parse(JSON.stringify(cat(id))) : {name:"",em:"📌",rep:"y",remind:7,age:0};
  function draw(){
    var n=id?db.items.filter(function(i){return i.cat===id;}).length:0;
    sheet('<h2>'+(id?"编辑分类":"新分类")+'</h2><label class="f" style="margin-top:0">名字</label><input id="cN" value="'+esc(c.name)+'" placeholder="比如：宠物疫苗、考试">'+
      '<label class="f">图标</label><div class="chips" id="cE">'+EMOJI.map(function(e){ return '<button data-e="'+e+'" class="'+(e===c.em?"on":"")+'">'+e+'</button>'; }).join("")+'</div>'+
      '<label class="f">新建日子时默认</label><div class="chips" id="cR">'+[["y","每年"],["m","每月"],["n","不重复"]].map(function(r){ return '<button data-r="'+r[0]+'" class="'+(c.rep===r[0]?"on":"")+'">'+r[1]+'</button>'; }).join("")+'</div>'+
      '<div class="chips" id="cM">'+[0,1,3,7,15,30,60,90].map(function(x){ return '<button data-m="'+x+'" class="'+(c.remind===x?"on":"")+'">'+(x?"提前 "+x+" 天":"当天")+'</button>'; }).join("")+'</div>'+
      '<div class="chk"><input type="checkbox" id="cA"'+(c.age?" checked":"")+'><label for="cA">按「几岁」显示（生日类），否则按「几周年」</label></div>'+
      '<div class="chk"><input type="checkbox" id="cX"'+(c.expire?" checked":"")+'><label for="cX">到期类（过期后标红，提示续期）</label></div>'+
      '<div class="row" style="margin-top:16px">'+(id?'<button class="ghost" data-act="del" style="flex:1;color:var(--accent)">删除</button>':'<button class="ghost" data-act="close" style="flex:1">取消</button>')+'<button class="btn" data-act="save" style="flex:2">保存</button></div>', function(act,b){
        if(act==="del"){ if(n){ toast("这个分类下还有 "+n+" 条，先把它们改到别的分类",2800); return; } if(db.cats.length<=1){ toast("至少保留一个分类"); return; }
          db.cats=db.cats.filter(function(x){return x.id!==id;}); if(filt===id) filt="all"; persist(); closeSheet(); renderSet(); return; }
        if(act!=="save") return;
        c.name=$("cN").value.trim(); if(!c.name){ toast("请填名字"); return; }
        c.age=$("cA").checked?1:0; c.expire=$("cX").checked?1:0;
        if(id) db.cats=db.cats.map(function(x){ return x.id===id?c:x; }); else { c.id="c"+(db.nextId++); db.cats.push(c); }
        persist(); closeSheet(); toast("已保存"); renderSet();
      });
    $("cE").onclick=function(e){ var b=e.target.closest("button"); if(!b) return; c.name=$("cN").value; c.em=b.dataset.e; draw(); };
    $("cR").onclick=function(e){ var b=e.target.closest("button"); if(!b) return; c.name=$("cN").value; c.rep=b.dataset.r; draw(); };
    $("cM").onclick=function(e){ var b=e.target.closest("button"); if(!b) return; c.name=$("cN").value; c.remind=+b.dataset.m; draw(); };
  }
  draw();
}

// 备份
function shareOrDownload(name,text,type){
  var blob=new Blob([text],{type:type}), f; try{ f=new File([blob],name,{type:type}); }catch(e){}
  if(f && navigator.canShare && navigator.canShare({files:[f]})){ navigator.share({files:[f]}).catch(function(){}); return; }
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){a.remove();},500);
}
$("exportJson").onclick=function(){
  var a=ymd(today());
  shareOrDownload("重要日子备份-"+a.y+"-"+("0"+a.m).slice(-2)+"-"+("0"+a.d).slice(-2)+".json", JSON.stringify({app:"rizi",v:1,at:Date.now(),db:db}), "application/json");
  db.lastBackup=Date.now(); delete db.bkSnooze; persist(); renderSet();
};
$("importBtn").onclick=function(){ $("importFile").click(); };
$("importFile").onchange=function(){
  var f=this.files[0]; if(!f) return; var r=new FileReader();
  r.onload=function(){ try{ var o=JSON.parse(r.result); if(o.app!=="rizi"||!o.db) throw 0;
    sheet('<h2>从备份恢复？</h2><p class="sub">备份里有 '+(o.db.items||[]).length+' 个日子。恢复后会替换这台手机上现在的内容。</p><div class="row"><button class="ghost" data-act="close" style="flex:1">取消</button><button class="btn" data-act="ok" style="flex:1">恢复</button></div>',function(act){
      if(act!=="ok") return; localStorage.setItem(KEY,JSON.stringify(o.db)); load(); closeSheet(); toast("已恢复"); goView("home"); });
  }catch(e){ toast("这不是重要日子的备份文件",2500); } };
  r.readAsText(f); this.value="";
};
function checkBackup(){
  var now=Date.now(), since=db.lastBackup||db.created, days=Math.floor((now-since)/DAY);
  var show=db.items.length>0 && days>=30 && !(db.bkSnooze && now<db.bkSnooze);
  $("bkCard").hidden=!show;
  if(show) $("bkText").textContent=db.lastBackup?"📦 已经 "+days+" 天没有备份了，花 10 秒备份一下吧。":"📦 用了一个月啦，记得备份一次，换手机时能恢复。";
}
$("bkGo").onclick=function(){ goView("set"); };
$("bkLater").onclick=function(){ db.bkSnooze=Date.now()+3*DAY; persist(); checkBackup(); };

// ---------- 导航与启动 ----------
function goView(v){
  [].forEach.call(document.querySelectorAll(".view"),function(s){ s.classList.toggle("on",s.id==="v-"+v); });
  [].forEach.call($("tabs").children,function(b){ b.classList.toggle("on",b.dataset.v===v); });
  $("fab").style.display = v==="home"?"":"none";
  if(v==="home") renderHome(); else renderSet();
  window.scrollTo(0,0);
}
$("tabs").addEventListener("click",function(e){ var b=e.target.closest("button"); if(b) goView(b.dataset.v); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden && $("v-home").classList.contains("on")) renderHome(); });
if(!db.name) $("welcome").classList.add("on");
$("wGo").onclick=function(){ var n=$("wName").value.trim(); if(!n){ $("wName").focus(); return; } db.name=n; persist(); $("welcome").classList.remove("on"); renderHome(); };
window.__t={lunarToSolar:lunarToSolar,solarToLunar:solarToLunar,occ:occurrence};
renderHome();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
